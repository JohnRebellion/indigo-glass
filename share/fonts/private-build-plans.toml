[buildPlans.IosevkaCustom]
family = "Iosevka Custom"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.IosevkaCustom.variants]
  inherits = "ss18"

    # Indigo Glass typography contract: double-storey allographs.
    # ss18 already declares these; pinning explicitly so future
    # `inherits` swaps don't silently regress to single-storey.
    [buildPlans.IosevkaCustom.variants.design]
    a = "double-storey-tailed"
    g = "double-storey"

[buildPlans.IosevkaCustom.weights.Thin]
shape = 100
menu = 100
css = 100

[buildPlans.IosevkaCustom.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaCustom.weights.Heavy]
shape = 900
menu = 900
css = 900

[buildPlans.IosevkaCustom.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaCustom.widths.Condensed]
shape = 416
menu = 3
css = "condensed"

[buildPlans.IosevkaCustom.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"