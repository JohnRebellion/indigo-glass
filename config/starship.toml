# Lime Glass — KDE Plasma 6.6 design system (brutalist-glass + Linear + Neumorphism)
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#A8E635)\
$os\
$username\
[](bg:#C1FF58 fg:#A8E635)\
$directory\
[](fg:#C1FF58 bg:#121216)\
$git_branch\
$git_status\
[](fg:#121216 bg:#0D0D10)\
$nodejs\
$rust\
$golang\
$python\
$java\
[](fg:#0D0D10 bg:#07080A)\
$time\
[ ](fg:#07080A)\
$line_break$character"""

palette = 'lime_glass'

# Values from tokens/out/css-vars.lime.css (Lime Glass default variant).
[palettes.lime_glass]
accent = '#A8E635'
accent_hi = '#C1FF58'
accent_alt = '#8BC406'
amber = '#FBBF24'
text = '#F8F8F8'
muted = '#6B7280'
bg_0 = '#07080A'
bg_1 = '#0D0D10'
bg_2 = '#121216'

[os]
disabled = false
style = "bg:#A8E635 fg:#F8F8F8"

[os.symbols]
Linux = " "
Fedora = " "

[username]
show_always = true
style_user = "bg:#A8E635 fg:#F8F8F8"
style_root = "bg:#A8E635 fg:#F8F8F8"
format = '[ $user ]($style)'

[directory]
style = "bg:#C1FF58 fg:#07080A"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:#121216 fg:#C1FF58"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#121216 fg:#FBBF24"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "bg:#0D0D10 fg:#8BC406"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#0D0D10 fg:#8BC406"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:#0D0D10 fg:#8BC406"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:#0D0D10 fg:#8BC406"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#0D0D10 fg:#8BC406"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#07080A fg:#6B7280"
format = '[ ♥ $time ]($style)'

[character]
success_symbol = '[❯](bold #C1FF58)'
error_symbol = '[❯](bold #ED254E)'
vimcmd_symbol = '[❮](bold #8BC406)'

[line_break]
disabled = false
