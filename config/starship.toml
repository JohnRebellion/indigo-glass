# Sage Ink — KDE Plasma 6.6 design system (neobrutalist ink + Linear + Neumorphism)
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#A6C9A6)\
$os\
$username\
[](bg:#C0E3C0 fg:#A6C9A6)\
$directory\
[](fg:#C0E3C0 bg:#121216)\
$git_branch\
$git_status\
[](fg:#121216 bg:#0D0D10)\
$nodejs\
$rust\
$golang\
$python\
$java\
[](fg:#0D0D10 bg:#07080A)\
$time\
[ ](fg:#07080A)\
$line_break$character"""

palette = 'sage_ink'

# Values from tokens/out/css-vars.sage.css (Sage Ink default variant).
[palettes.sage_ink]
accent = '#A6C9A6'
accent_hi = '#C0E3C0'
accent_alt = '#89A889'
amber = '#FBBF24'
text = '#F8F8F8'
muted = '#7F8695'
bg_0 = '#07080A'
bg_1 = '#0D0D10'
bg_2 = '#121216'

[os]
disabled = false
# fg was #F8F8F8 (text) on bg:#A6C9A6 (accent) — 1.72:1, fails WCAG's 4.5:1
# text floor. Every other light-background segment in this format (directory:
# bg:#C0E3C0 fg:#07080A) already pairs a light accent with the dark bg_0
# ink text, not the light `text` token. Fixed 2026-09-25 to match that
# established pattern: 10.99:1.
style = "bg:#A6C9A6 fg:#07080A"

[os.symbols]
Linux = " "
Fedora = " "

[username]
show_always = true
# Same fix as [os] above (contrast 1.72:1 -> 10.99:1), same reason.
style_user = "bg:#A6C9A6 fg:#07080A"
style_root = "bg:#A6C9A6 fg:#07080A"
format = '[ $user ]($style)'

[directory]
style = "bg:#C0E3C0 fg:#07080A"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:#121216 fg:#C0E3C0"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#121216 fg:#FBBF24"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "bg:#0D0D10 fg:#89A889"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#0D0D10 fg:#89A889"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:#0D0D10 fg:#89A889"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:#0D0D10 fg:#89A889"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#0D0D10 fg:#89A889"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#07080A fg:#7F8695"
format = '[ ♥ $time ]($style)'

[character]
success_symbol = '[❯](bold #C0E3C0)'
error_symbol = '[❯](bold #F42E53)'
vimcmd_symbol = '[❮](bold #89A889)'

[line_break]
disabled = false
