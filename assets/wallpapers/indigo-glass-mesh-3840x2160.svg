<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <title>Indigo Glass mesh wallpaper</title>
  <desc>3840x2160. Procedural mesh: 4 radial blobs blended on near-black base. Indigo + violet anchors, low saturation, gaussian-blurred so the texture is ambient context, never distraction.</desc>

  <defs>
    <radialGradient id="blob1" cx="20%" cy="30%" r="55%">
      <stop offset="0%"  stop-color="#5E6AD2" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#5E6AD2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="75%" cy="20%" r="50%">
      <stop offset="0%"  stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="80%" cy="80%" r="60%">
      <stop offset="0%"  stop-color="#A78BFA" stop-opacity="0.40"/>
      <stop offset="65%" stop-color="#A78BFA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="15%" cy="85%" r="45%">
      <stop offset="0%"  stop-color="#1F2028" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1F2028" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>

    <pattern id="grain" patternUnits="userSpaceOnUse" width="3" height="3">
      <rect width="3" height="3" fill="#0F0F12"/>
      <rect x="0" y="0" width="1" height="1" fill="#1F2028" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="#0F0F12"/>
  <rect width="3840" height="2160" fill="url(#grain)" opacity="0.40"/>

  <g filter="url(#soften)">
    <rect width="3840" height="2160" fill="url(#blob1)"/>
    <rect width="3840" height="2160" fill="url(#blob2)"/>
    <rect width="3840" height="2160" fill="url(#blob3)"/>
    <rect width="3840" height="2160" fill="url(#blob4)"/>
  </g>

  <rect width="3840" height="2160" fill="#0F0F12" opacity="0.10"/>
</svg>
