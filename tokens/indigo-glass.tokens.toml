# Lime Glass - design tokens (single source of truth)
#
# Every layer (KDE, VSCode, browser, GRUB, Windows) derives its
# concrete config from this file via tokens/codegen.py.
#
# Schema version: 2
# Last token revision: 2026-06-26 (OKLCH authoring + glassmorphism 2.0 pass)
#
# Edit values here, run codegen, commit results. Do NOT hardcode hex
# in layer configs anymore.
#
# v2: The palette is now authored in OKLCH (perceptually uniform). codegen
# derives byte-identical sRGB hex (for KDE/GTK/GRUB/Windows), display-p3,
# and native oklch() CSS from these values. See tokens/README.md.

[meta]
schema_version = 3
name = "Lime Glass"                 # active brand name (was "Indigo Glass")
description = "brutalist-glass + Linear dark discipline + Neumorphism 2.0 - compact, translucent, single-accent"
density = "compact"
glass_style = "translucent_backdrop"  # NOT refraction. Backdrop blur only.
revision = 3
color_authoring = "oklch"  # source of truth is [variants.*]; hex is derived
default_variant = "lime"   # which variant [palette] resolves to + which installs
# v3: palette is now multi-variant. Shared tokens (spacing/radius/blur/type/
# motion/glass) are variant-agnostic; only [variants.<name>] carries colors.
# codegen resolves default_variant into [palette] for legacy single-set output
# AND emits per-variant files (css-vars.<v>.css, kde-palette.<v>.colors, ...).

# =============================================================================
# VARIANTS - per-theme OKLCH palettes (SOURCE OF TRUTH)
# =============================================================================
# Perceptually uniform: [L, C, H]. L=lightness 0-1, C=chroma, H=hue degrees.
# Single-accent rule: hover/active are SAME hue, only L shifts (see [palette.derive]).
# Every variant defines the same key set so codegen treats them uniformly.
# `accent`/`accent_hi`/`accent_alt` are the brand triple (was indigo/indigo_hi/violet).

[variants.indigo]
name        = "Indigo Glass"
brand_hue   = "indigo"
# Surfaces (cool near-black)
base        = [0.1698, 0.0062, 285.72]
surface     = [0.2286, 0.0096, 285.62]
surface_alt = [0.2460, 0.0152, 279.60]
sidebar     = [0.2108, 0.0078, 285.71]
# Brand (indigo / indigo_hi / violet)
accent      = [0.5674, 0.1585, 275.21]
accent_hi   = [0.6801, 0.1583, 276.93]
accent_alt  = [0.7090, 0.1592, 293.54]
# Semantic
amber       = [0.8369, 0.1644, 84.43]
positive    = [0.8792, 0.1706, 152.51]
negative    = [0.6124, 0.2279, 17.60]
# Text
text        = [0.9791, 0.0000, 89.88]
text_muted  = [0.5510, 0.0234, 264.36]
text_dim    = [0.4461, 0.0263, 256.80]

[variants.lime]
name        = "Lime Glass"
brand_hue   = "lime"
# Surfaces (lime-tinted near-black; hue ~120 so glass reads warm-green dark)
# Surfaces: NEUTRAL deep near-black (NOT lime-tinted). Raycast-deep ladder
# (#07080A family) - deeper than Indigo Glass's #0F0F12 to MAXIMIZE lime
# contrast (13.39:1 vs 12.79:1) while staying OLED-safe (not pure #000, so no
# halation) and preserving depth-via-elevation. Per user: deeper blacks.
base        = [0.1340, 0.0051, 262.32]   # #07080A - Raycast-deep near-black
surface     = [0.1605, 0.0063, 285.67]   # #0D0D10
surface_alt = [0.1840, 0.0081, 285.58]   # #121216 (glass base)
sidebar     = [0.1462, 0.0064, 285.58]   # #0A0A0D
# Brand (lime / lime_hi / lime_alt) - single hue 127.71, AA-verified on base
accent      = [0.8523, 0.2049, 127.71]   # #A8E635 ghost lime
accent_hi   = [0.9323, 0.2049, 127.71]   # #C1FF58 hover (brighter)
accent_alt  = [0.7523, 0.1947, 127.71]   # #8BC407 active/decoration
# Semantic (unchanged hues - warnings/errors must stay legible vs lime)
amber       = [0.8369, 0.1644, 84.43]
positive    = [0.8792, 0.1706, 152.51]
negative    = [0.6124, 0.2279, 17.60]
# Text: neutral (matches the neutral base; no green tint)
text        = [0.9791, 0.0000, 89.88]    # #F8F8F8
text_muted  = [0.5510, 0.0234, 264.36]   # #6B7280
text_dim    = [0.4461, 0.0263, 256.80]   # #4B5563

# Alpha-channel surfaces (RGBA derived per-variant). [base_key_or_hex, alpha].
# Shared across variants (white-on-dark borders + base scrim).
[palette.alpha]
overlay       = ["base", 0.80]    # 80% scrim for modals
border        = ["#FFFFFF", 0.06]  # ~6% white - subtle glass edge
border_strong = ["#FFFFFF", 0.10]  # ~10% - more visible on hover

# =============================================================================
# DERIVED ACCENT STEPS (OKLCH lightness shifts - documentation only)
# =============================================================================
# These are emitted as CSS relative-color helpers, not stored as hex, so the
# single-accent rule holds: every step is the SAME hue, only L changes.
[palette.derive]
hover_dl     = 0.06   # +L for hover state    oklch(from c calc(l + 0.06) c h)
active_dl    = -0.04  # -L for pressed state
subtle_dl    = -0.10  # dim variant for secondary surfaces

# =============================================================================
# DENSITY - compact Linear-style spacing
# =============================================================================
# Tightened from default Klassy/Material values. Smaller padding
# inside interactive elements, smaller gaps between elements.
# Goal: information density without crowding.

[spacing]
# Inner padding (inside interactive elements)
pad_xs       = 2    # icon-only buttons, mini chips
pad_sm       = 4    # tight buttons, list items
pad_md       = 6    # standard buttons, inputs
pad_lg       = 10   # primary buttons, modal headers
pad_xl       = 16   # section padding only

# Outer margins (between elements)
gap_xs       = 2    # icon clusters
gap_sm       = 4    # form fields, list items
gap_md       = 8    # section internal
gap_lg       = 12   # section to section
gap_xl       = 20   # major regions

# Button-specific (compact yet legible)
button_pad_y = 4
button_pad_x = 10   # asymmetric: less vertical, more horizontal for legibility
icon_button_pad = 4

# Input
input_pad_y  = 4
input_pad_x  = 8

# List row
list_row_pad_y = 3
list_row_pad_x = 8
list_row_gap   = 1  # near-flush rows

# Sidebar
sidebar_item_pad_y = 3
sidebar_item_pad_x = 8

# =============================================================================
# RADIUS - 8px default per visionOS, sharper for chips
# =============================================================================

[radius]
none   = 0
xs     = 2     # pill chips, tags
sm     = 4     # inputs, small buttons
md     = 6     # toggles
default = 8    # canonical Klassy match
lg     = 12    # modals, cards
xl     = 16    # large panels
full   = 9999  # circles

# Squircle / superellipse corners (2026 premium corner geometry).
# Emitted as CSS `corner-shape: superellipse(N)` with an SVG clip-path
# fallback for Firefox/Safari (corner-shape is Chromium 139+ as of 2026).
# n=2 is the Apple "squircle"; higher n -> closer to square corner.
[radius.squircle]
enabled       = true
superellipse_n = 2      # corner-shape: superellipse(2) == squircle
# Surfaces that opt into squircle geometry (web/simulator only; KDE uses
# Klassy CornerRadius which approximates via standard radius).
apply_to      = ["card", "modal", "avatar", "app-icon"]

# =============================================================================
# BLUR - backdrop-filter values (visionOS-style translucent backdrop)
# =============================================================================
# NOT refraction (Apple Liquid Glass clear). Pure backdrop blur.

[blur]
none = 0
sm   = 8
md   = 13   # matches KWin BlurStrength=13 (Indigo Glass canonical)
lg   = 20
xl   = 32

# =============================================================================
# OPACITY - layered translucency
# =============================================================================

[opacity]
window_active   = 0.92
window_inactive = 0.85
glass_panel     = 0.70   # behind backdrop blur
glass_panel_lo  = 0.55
glass_panel_hi  = 0.85
overlay_scrim   = 0.80
disabled        = 0.40
hover_tint      = 0.10

# =============================================================================
# SHADOW - selective Neumorphism 2.0 (interactive elements only)
# =============================================================================

[shadow]
none           = "none"
glass_sm       = "0 2px 8px rgba(0,0,0,0.30)"
glass          = "0 4px 24px rgba(0,0,0,0.40), 0 0 0 1px rgba(255,255,255,0.06)"
glass_lg       = "0 8px 48px rgba(0,0,0,0.50), 0 0 0 1px rgba(255,255,255,0.06)"
neu_raised     = "-2px -2px 6px rgba(255,255,255,0.04), 2px 2px 6px rgba(0,0,0,0.40)"
neu_pressed    = "inset -2px -2px 6px rgba(255,255,255,0.04), inset 2px 2px 6px rgba(0,0,0,0.40)"
indigo_glow    = "0 0 0 2px rgba(94,106,210,0.30)"
indigo_glow_lg = "0 0 24px rgba(94,106,210,0.40)"

# =============================================================================
# TYPOGRAPHY
# =============================================================================
# Type scale: minor third (1.2x) for compact rhythm.
# Base anchor = 11pt (Nobara desktop reference). All sizes derive.

[type.families]
prose  = ["Carlito", "SF Pro Display", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "system-ui", "sans-serif"]
chrome = ["SF Pro Display", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Inter", "system-ui", "sans-serif"]
mono   = ["Iosevka Custom Condensed", "Iosevka Custom", "MesloLGS NF", "JetBrainsMono Nerd Font", "JetBrainsMono NF", "Cascadia Code", "Fira Code", "Consolas", "monospace"]

[type.scale]
# Multiplier-based scale. ratio = 1.2 (minor third).
# Anchor at body=11pt for Nobara desktop.
ratio = 1.2
anchor_pt = 11

# Derived sizes (anchor * ratio^n)
xs_pt   = 8     # 11 / 1.2 / 1.2 (-2 step), tooltips
sm_pt   = 9     # 11 / 1.2 (-1 step), captions/smallest readable
md_pt   = 11    # anchor, body
lg_pt   = 13    # +1 step, headings small
xl_pt   = 16    # +2 step, headings medium
xxl_pt  = 19    # +3 step, headings large
hero_pt = 23    # +4 step, hero only

# Per-role aliases (what each surface uses)
[type.roles]
body_pt          = 11
mono_pt          = 11
menu_pt          = 11
toolbar_pt       = 10
smallest_pt      = 9
caption_pt       = 9
window_title_pt  = 11
heading_pt       = 13
section_pt       = 16

[type.line_height]
# Tight for Linear discipline, looser for prose-heavy regions
tight   = 1.20
default = 1.40
prose   = 1.55

# =============================================================================
# MOTION (subdued, no animation overload)
# =============================================================================

[motion.duration_ms]
instant  = 60
quick    = 120
default  = 200
slow     = 320
hero     = 500

[motion.easing]
# CSS cubic-bezier values
standard  = "cubic-bezier(0.4, 0.0, 0.2, 1.0)"  # M3 standard
emphasize = "cubic-bezier(0.2, 0.0, 0.0, 1.0)"  # M3 emphasize
spring    = "cubic-bezier(0.34, 1.56, 0.64, 1.0)"  # mild overshoot (NOT bouncy)

# Semantic interaction -> (duration role, easing role). Mirrors the 2026
# micro-interaction timing standard (150-400ms band). codegen emits these
# as ready-to-use transition shorthands: --ig-motion-<role>.
[motion.roles]
button_hover  = ["quick", "standard"]    # 120ms - scale/color
focus_ring    = ["quick", "standard"]    # 120ms - outline
card_hover    = ["default", "standard"]  # 200ms - lift + shadow
toggle        = ["default", "standard"]  # 200ms - slide
panel_open    = ["slow", "emphasize"]    # 320ms - sheet expand
neu_press     = ["quick", "spring"]      # 120ms - pillowy push (overshoot)
state_draw    = ["hero", "emphasize"]    # 500ms - success/error draw

# =============================================================================
# ACCESSIBILITY
# =============================================================================

[a11y]
# When prefers-reduced-transparency: opacities go to 1.0, blur disabled.
# When prefers-reduced-motion: motion durations go to 0 or instant only.
reduce_transparency_opacity = 1.0
reduce_motion_duration_ms = 0
focus_outline_width_px = 2

# =============================================================================
# GLASS COMPOSITION (visionOS-style backdrop-blur layering)
# =============================================================================
# Render order: base bg -> backdrop-filter blur -> tinted overlay -> content
# NO refraction filter. Just blur + indigo tint at low opacity.

[glass]
# Default glass surface (cards, panels, modals).
# backdrop_tint / backdrop_bg are DERIVED per-variant by codegen:
#   tint = <variant.accent> @ tint_alpha ; bg = <variant.surface_alt> @ bg_alpha
# so the glass picks up each variant's accent automatically.
backdrop_blur = 13          # matches KWin BlurStrength
tint_alpha    = 0.03        # accent tint opacity (~3% for warmth)
bg_alpha      = 0.70        # surface_alt opacity behind blur
border        = "#FFFFFF14" # 8% white

# Compositor render params (KWin kwin-effects-better-blur-dx + Dark Reader).
#
# BLUR passes through KWin already, but ForceContrastParams=true was a mistake:
# when combined with Brightness < 100 it FORCES the blurred output to be
# darkened by that percentage, which -- combined with our 12-15% window
# translucency -- produced solid-black-looking blur regions on real hardware
# (only surfaces once the compositor is freshly initialised at boot; qdbus
# reconfigure alone didn't reproduce it).
#
# Fix: force_contrast_params = false (KWin default). Brightness/Saturation/
# Contrast still exist in the token file because the browser Dark Reader
# retint uses `brightness` and matches CSS `saturate()` there, but on the
# COMPOSITOR side those values are ignored unless force_contrast_params=true.
[glass.render]
brightness   = 96    # Dark Reader brightness (canonical soft-light);
                     # NOT applied to KWin blur when force_contrast_params=false
saturation   = 110   # matches CSS `saturate(110%)`; also inert for KWin blur
contrast     = 100
noise_strength = 4    # KWin NoiseStrength - compositor-native grain
                      # (the desktop equivalent of [glass.grain] for web)
force_contrast_params = false  # was true; caused black-blur on real hardware

# Grain / frosted-glass micro-texture (Glassmorphism 2.0 differentiator).
# A static fractal-noise SVG layered ON TOP of the blur (not behind it),
# at very low opacity. Simulates sandblasted/ground glass tactility.
# Distinct from [glass] refraction displacement in liquid-glass.css.
[glass.grain]
enabled        = true
opacity        = 0.04   # 3-6% band; 4% reads as texture, not noise
base_frequency = 0.65   # feTurbulence baseFrequency (high = fine grain)
num_octaves    = 3
tile_px        = 200    # background-size of the noise tile

# =============================================================================
# AMBIENT - light-source gradient orbs behind glass (visionOS "lit glass")
# =============================================================================
# Large, soft radial gradients positioned as pseudo-light-sources behind
# glass panels. MUST use the existing indigo/violet hues only (single-accent
# rule). Already realized by simulator mesh.css / .ig-mesh-hero; these tokens
# canonicalize the values so every layer matches.

[ambient]
enabled            = true
orb_primary        = "indigo"   # palette key
orb_primary_opacity = 0.06      # 5-6% - barely perceptible warmth
orb_secondary      = "violet"
orb_secondary_opacity = 0.04
orb_tertiary       = "indigo_hi"
orb_tertiary_opacity = 0.03
feather_px         = 120        # blur radius for orb softness
# Default orb placements (pct of viewport). Kept sparse for restraint.
positions = [
  { color = "orb_primary",   x = 25, y = 25 },
  { color = "orb_secondary", x = 78, y = 75 },
  { color = "orb_tertiary",  x = 60, y = 100 },
]
