# Indigo Glass - Acer Aspire 5, 14" 1080p @ Win 100% scale
#
# DPI math: 1920x1080 over 14" diagonal = 157 effective DPI.
# Reference (27" 1440p): 109 DPI. Raw ratio: 157/109 = 1.44x.
#
# Scale history (in-situ tested):
#   1.44x -> Carlito 16pt overflowed Plasma panel chrome + menus.
#   1.33x -> still cramped vs reference 27in feel.
#   1.27x -> clean integer landings, +3pt body, tight but readable.
# User-confirmed 1.27x on 2026-06-06.

[meta]
name = "Acer Aspire 5"
display_inches = 14
display_resolution = "1920x1080"
display_dpi_effective = 157
scale_factor = 1.27
description = "14in 1080p, Win 100% scale, fonts ~1.27x of 27in 1440p default"

[fonts]
body_pt = 14           # 11 * 1.27 = 13.97 -> 14
mono_pt = 14
menu_pt = 14
toolbar_pt = 13        # 10 * 1.27 = 12.7  -> 13
smallest_pt = 11       # 9  * 1.27 = 11.43 -> 11
window_title_pt = 14

[konsole]
font_size = 16         # 13 * 1.27 = 16.51 -> 16 (round down to match vsc terminal)

[vscode]
editor_fontsize = 18   # 14 * 1.27 = 17.78 -> 18
chat_fontsize = 16     # 13 * 1.27 = 16.51 -> 16
terminal_fontsize = 16

[windows_terminal]
font_size = 13         # 10 * 1.27 = 12.7  -> 13

[kde]
panel_pt = 14

[gtk]
font_pt = 14
