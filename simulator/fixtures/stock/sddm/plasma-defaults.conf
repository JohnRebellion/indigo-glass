# STOCK FIXTURE: runtime values the Breeze greeter depends on that no theme file
# states, written out with their provenance (2026-09-25). Everything else on
# the stock lane is read from the verbatim files beside this one.
#
#   [Font]      Plasma 6's compiled-in default font (kdeglobals General/font
#               default, as fixtures/stock/kde-colors/kdeglobals records). The
#               greeter runs as the sddm user with no kdeglobals of its own.
#   [Units]     Kirigami.Units.gridUnit = the default font's line height:
#               Noto Sans 10pt at 96 dpi is 13.33px with 1.362 line spacing -> 18px.
#               iconSizes.large = 48 (Kirigami Units.qml, KF6).
#   [Users]     SDDM's own default for [Users] DisableAvatarsThreshold is 7
#               (man sddm.conf); Main.qml shows avatars when count <= threshold.
#   [Wallpaper] theme.conf background= resolves to plasma-breeze-common's Next
#               wallpaper (/usr/share/wallpapers/Next/contents/images/5120x2880.png,
#               rpm -qf: plasma-breeze-common-6.7.4-2.fc44). next-640x360-faded.jpg is
#               that PNG downscaled with PIL and gaussian-blurred (radius 8.5px at
#               640 wide = FastBlur radius 50 at 1920) to stand in for
#               WallpaperFader's "on" state; its colour matrix (contrast 0.8,
#               saturation 1.5, intensity 0.7 for a dark Complementary set) is
#               applied by the page as a CSS filter. Baked, because the drift guard
#               bans the CSS blur filter in simulator sources outside /sites/*/stock.css.
#   [Locale]    Qt's en_US short time format ("h:mm AP") and long date format;
#               Clock.qml formats with Locale.ShortFormat / Locale.LongFormat.
[Font]
family=Noto Sans
pointSize=10

[Units]
gridUnit=18
smallSpacing=4
largeSpacing=8
iconLarge=48

[Users]
DisableAvatarsThreshold=7

[Wallpaper]
image=next-640x360-faded.jpg
contrast=0.8
saturation=1.5
intensity=0.7

[Locale]
time=9:41 AM
date=Thursday, 25 September 2026

# [Approximated] libplasma draws the password field and buttons from the
# default desktoptheme's widgets/lineedit.svgz and button.svgz frames. They are
# NOT parsed here: a 1px frame in the colour set's inactive text colour, a 3px
# corner and a 2-gridUnit height stand in for them. Low fidelity, disclosed on
# the page.
[Approximated]
frameWidth=1
frameRadius=3
fieldHeight=36
