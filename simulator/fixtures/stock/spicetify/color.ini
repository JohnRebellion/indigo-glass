; Spotify's own default dark look, reconstructed as a color.ini so this
; page's INI reader (../ini.ts, the same one used for KDE/Konsole/VLC/GTK)
; can parse it the same way it parses the shipped file. Spotify/Spicetify
; are NOT installed on this host, so nothing here is copied from a live
; client - see each block below for what is cited and what is approximated.
;
; Key list and "what UI element each key paints" is Spicetify's own, quoted
; verbatim from spicetify-cli's shipped default theme (github.com/spicetify/
; spicetify-cli, Themes/SpicetifyDefault/color.ini, fetched 2026-09-25):
;   text               = Main field text; playlist names in main field and sidebar; headings.
;   subtext            = Text in main sidebar buttons; playlist names in sidebar; artist names and mini infos.
;   main               = Main field background.
;   sidebar            = Sidebar background.
;   player             = Player background.
;   card               = Card background on hover; player area outline.
;   shadow             = Card drop shadow; button background.
;   selected-row       = Color of selected song, scrollbar, caption and playlist details, download and options buttons.
;   button             = Playlist button background in sidebar; drop-down menus; now playing song; play button background; like button.
;   button-active      = Active play button background.
;   button-disabled    = Seekbar and volume bar background.
;   tab-active         = Tabbar active item background in header.
;   notification       = Notification toast.
;   notification-error = Error notification toast.
;   misc               = Miscellaneous.
;
; Values (not the key list) are Spotify's own, not Spicetify's - reconstructed
; per key below, each disclosed as cited or approximated:
;   text=FFFFFF / subtext=B3B3B3 / button-disabled=6A6A6A - "strongest to most
;     muted" text ramp, colorpalettegenerator.ai's Spotify brand-colour page
;     (third-party, not an official Spotify token doc; fetched 2026-09-25).
;   main=121212 / card=282828 / misc=404040 - background / surface / border,
;     independently corroborated across multiple third-party Spotify
;     brand-colour pages (fetched 2026-09-25).
;   button/notification=1ED760 - Spotify's current "Bright Green" UI accent
;     (post-2023 redesign; the older logo green is 1DB954, not the live UI
;     chrome this page compares against).
;   notification-error=E22134 - independently corroborated: this exact value
;     is ALSO the [green-dark] scheme's own notification-error in
;     spicetify-cli's shipped color.ini (same fetch) - several community
;     schemes carry it through untouched because it is Spotify's own
;     error/explicit-content red, not a themed choice.
;   sidebar=000000 - widely and consistently shown as pure black across public
;     Spotify desktop screenshots; no single authoritative citation found this
;     pass, so treated as community-observed, not vendor-documented.
;   player=181818 / selected-row=282828 / tab-active=282828 /
;   button-active=3BE477 / shadow=000000 - no direct citation found this
;   pass; approximated from the cited background ramp above (player as a mid
;   step between sidebar-black and card-grey, selected-row/tab-active as the
;   card shade, button-active as a lightened button green, shadow as flat
;   black) - disclosed as approximated, not asserted as sourced.
;
; [base]/[dark] section names mirror the shipped file's own two sections so
; ../ini.ts's shared parser reads both the same way. Spotify itself ships no
; such ini file at all - this is a comparison device for this page, not a
; claim that stock Spotify has a "colour scheme file".

[base]
text                = FFFFFF
subtext             = B3B3B3
sidebar-text        = FFFFFF
main                = 121212
sidebar             = 000000
player              = 181818
card                = 282828
shadow              = 000000
selected-row        = 282828
button              = 1ED760
button-active       = 3BE477
button-disabled     = 6A6A6A
tab-active          = 282828
notification        = 1ED760
notification-error  = E22134
misc                = 404040
equalizer           = 1ED760

[dark]
