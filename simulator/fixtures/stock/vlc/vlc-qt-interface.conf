# Sage Ink stock fixture -- VLC 3.0.x compiled-in toolbar defaults.
#
# VLC does not write these keys to vlc-qt-interface.conf until the toolbar
# editor (Tools > Customize Interface) is opened and saved; a config
# directory that has never seen the editor falls back to the *_TB_DEFAULT
# macros hardcoded in modules/gui/qt/components/controller.hpp:
#   #define MAIN_TB1_DEFAULT "64;39;64;38;65"
#   #define MAIN_TB2_DEFAULT "0-2;64;3;1;4;64;7;9;64;10;20;19;64-4;37;65;35-4"
#   #define ADV_TB_DEFAULT   "12;11;13;14"
#   #define INPT_TB_DEFAULT  "43;33-4;44"
#   #define FSC_TB_DEFAULT   "0-2;64;3;1;4;64;37;64;38;64;8;65;25;35-4;34"
# VLC 3.0.x branch, commit 04d8fcb923dcab281755c1a8dd07b6c2e1fc2ea1:
# https://github.com/videolan/vlc/blob/04d8fcb923dcab281755c1a8dd07b6c2e1fc2ea1/modules/gui/qt/components/controller.hpp#L37-L41
#
# Reproduced here as [MainWindow]/<Key>=<value> -- the same group/key shape
# vlc-qt-interface.conf uses once the editor writes it (confirmed against
# modules/gui/qt/components/controller.cpp: getSettings()->value(
# "MainWindow/MainToolbar1", MAIN_TB1_DEFAULT ), etc., same branch, commit
# 04d8fcb9) -- so the same INI parser that reads the shipped
# vlc/vlc-qt-interface.ini can render this lane.
#
# Installed host: vlc-3.0.23-10.fc44.x86_64 (`rpm -q vlc`), same branch.

[MainWindow]
MainToolbar1="64;39;64;38;65"
MainToolbar2="0-2;64;3;1;4;64;7;9;64;10;20;19;64-4;37;65;35-4"
AdvToolbar="12;11;13;14"
InputToolbar="43;33-4;44"
FSCtoolbar="0-2;64;3;1;4;64;37;64;38;64;8;65;25;35-4;34"
FSCToolbar="0-2;64;3;1;4;64;37;64;38;64;8;65;25;35-4;34"
