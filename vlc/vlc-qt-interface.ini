# Sage Ink - VLC 3.x toolbar layout. Hand-kept: layout, not colour.
# Apply with: python3 scripts/apply-vlc.py (merges into
# ~/.config/vlc/vlc-qt-interface.conf, key by key).
#
# These are VLC 3.0's stock toolbars (components/controller.hpp,
# *_TB_DEFAULT) with exactly one change: the WIDGET_SHINY flag ("-4") is
# dropped from the seek slider (33) and the volume slider (35). A shiny seek
# bar is SeekStyle, which paints a hardcoded blue QColor(50,156,255) gradient
# over a darker(140) groove gradient; a shiny volume bar is a triangle filled
# with the qt-slider-colours gradient. Without the flag both are plain
# QSliders, painted by the Qt style from the SageInk palette - accent fill,
# flat groove, no literal colour anywhere.
#
# Values are quoted because QSettings INI treats a bare ';' as a comment.
# FSC is written under both spellings: controller.cpp reads "FSCtoolbar",
# the toolbar editor (dialogs/toolbar.cpp) saves "FSCToolbar".

[MainWindow]
MainToolbar1="64;39;64;38;65"
MainToolbar2="0-2;64;3;1;4;64;7;9;64;10;20;19;64-4;37;65;35"
AdvToolbar="12;11;13;14"
InputToolbar="43;33;44"
FSCtoolbar="0-2;64;3;1;4;64;37;64;38;64;8;65;25;35;34"
FSCToolbar="0-2;64;3;1;4;64;37;64;38;64;8;65;25;35;34"
